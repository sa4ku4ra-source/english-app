<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>My English Notebook</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>My English Notebook</h1>
    <p class="sub">話して、聞いて、自分だけのストックをつくる</p>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="talk">💬 会話</button>
    <button class="tab" data-view="library">📌 ストック</button>
    <button class="tab" data-view="settings">⚙️ 設定</button>
  </nav>

  <main>
    <!-- 会話 -->
    <section id="view-talk" class="view active">
      <div id="talk-targets" class="targets"></div>
      <div id="chat" class="chat"></div>
      <p id="chat-hint" class="muted small hint">
        英語でも日本語でも、普段どおり話しかけてください。AIはずっと英語で返します。<br>
        「これ英語でなんて言う？」と聞いた表現や、英語で言えずに日本語で話した部分はストックされ、「他の言い方ある？」でもう1つ追加されます。<br>
        🎤で話している途中でも、🇺🇸/🇯🇵ボタンで英語⇄日本語を切り替えられます。<br>
        わからない単語は<b>長押し</b>で調べられます。
      </p>
      <div id="feedback" hidden></div>
      <div class="composer">
        <textarea id="chat-input" rows="2" placeholder="英語で（困ったら日本語でもOK）"></textarea>
        <div class="row">
          <button id="mic" class="btn mic" type="button">🎤 話す</button>
          <button id="mic-lang" class="btn lang" type="button" title="話している途中でも切り替えられます">🇺🇸 英語</button>
          <button id="send" class="btn primary" type="button">送信</button>
        </div>
        <button id="end-talk" class="btn danger wide" type="button">会話を終了してフィードバックを見る</button>
      </div>
    </section>

    <!-- ストック -->
    <section id="view-library" class="view">
      <div class="row">
        <input id="search" type="search" placeholder="検索（日本語・英語）">
      </div>
      <p id="lib-count" class="muted"></p>
      <div id="library-list"></div>
    </section>

    <!-- 設定 -->
    <section id="view-settings" class="view">
      <div class="card">
        <label for="api-key" class="label">Anthropic APIキー</label>
        <input id="api-key" type="password" placeholder="sk-ant-..." autocomplete="off">
        <p class="muted small">キーはこの端末のブラウザ内にだけ保存され、Anthropic以外には送信されません。</p>
        <label for="model" class="label">AIモデル</label>
        <select id="model">
          <option value="claude-opus-5-5">Claude Opus 5.5（高品質・標準）</option>
          <option value="claude-sonnet-5-5">Claude Sonnet 5.5（速い・安い）</option>
          <option value="claude-haiku-5-5">Claude Haiku 5.5（最速・最安）</option>
        </select>
      </div>
      <div class="card">
        <label for="voice" class="label">読み上げの声</label>
        <select id="voice"></select>
        <label for="rate" class="label">標準スピード <span id="rate-val"></span></label>
        <input id="rate" type="range" min="0.5" max="1.3" step="0.05">
        <label for="accent" class="label">英語のアクセント</label>
        <select id="accent">
          <option value="American">アメリカ英語</option>
          <option value="British">イギリス英語</option>
          <option value="Australian">オーストラリア英語</option>
        </select>
        <button id="test-voice" class="btn ghost" type="button">▶ 声をテスト</button>
      </div>
      <div class="card">
        <p class="label">データ（ストックのバックアップ）</p>
        <div class="row">
          <button id="export" class="btn ghost" type="button">書き出し</button>
          <label class="btn ghost file">読み込み<input id="import" type="file" accept="application/json" hidden></label>
        </div>
      </div>
    </section>
  </main>

  <!-- 長押しで開く「調べる」シート -->
  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <div id="sheet" class="sheet" hidden></div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
