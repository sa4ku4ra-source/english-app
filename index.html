<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>My English Notebook</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>My English Notebook</h1>
    <p class="sub">自分の日常会話が、自分だけの教材になる</p>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="add">＋ 追加</button>
    <button class="tab" data-view="library">📚 教材</button>
    <button class="tab" data-view="talk">💬 会話</button>
    <button class="tab" data-view="settings">⚙️ 設定</button>
  </nav>

  <main>
    <!-- 追加 -->
    <section id="view-add" class="view active">
      <div class="card">
        <label for="ja-input" class="label">普段話している日本語</label>
        <textarea id="ja-input" rows="3" placeholder="例：ちょっとコンビニ寄ってから行くね"></textarea>
        <label for="ctx-input" class="label small">場面・相手（任意）</label>
        <input id="ctx-input" type="text" placeholder="例：友達にLINEで / 職場の同僚に">
        <div class="row">
          <button id="ja-mic" class="btn ghost" type="button">🎤 日本語で話して入力</button>
          <button id="translate-btn" class="btn primary" type="button">ネイティブ英語にする</button>
        </div>
      </div>
      <div id="translate-result"></div>
    </section>

    <!-- 教材 -->
    <section id="view-library" class="view">
      <div class="row">
        <input id="search" type="search" placeholder="検索（日本語・英語）">
      </div>
      <p id="lib-count" class="muted"></p>
      <div id="library-list"></div>
    </section>

    <!-- 会話 -->
    <section id="view-talk" class="view">
      <div id="talk-setup" class="card">
        <p class="label">会話で練習するフレーズを選ぶ</p>
        <p class="muted small">選んだフレーズを自然に使えるような会話をAIが始めます。未選択なら最近の教材から5つ自動で選びます。</p>
        <div id="talk-picks"></div>
        <button id="start-talk" class="btn primary" type="button">会話をはじめる</button>
      </div>

      <div id="talk-room" hidden>
        <div id="talk-targets" class="targets"></div>
        <div id="chat" class="chat"></div>
        <div class="composer">
          <textarea id="chat-input" rows="2" placeholder="英語で（困ったら日本語でもOK）"></textarea>
          <div class="row">
            <button id="mic-en" class="btn mic" type="button">🎤 英語で話す</button>
            <button id="mic-ja" class="btn ghost" type="button">🎤 日本語</button>
            <button id="send" class="btn primary" type="button">送信</button>
          </div>
          <button id="end-talk" class="btn danger wide" type="button">会話を終了してフィードバックを見る</button>
        </div>
      </div>

      <div id="feedback" hidden></div>
    </section>

    <!-- 設定 -->
    <section id="view-settings" class="view">
      <div class="card">
        <label for="api-key" class="label">Anthropic APIキー</label>
        <input id="api-key" type="password" placeholder="sk-ant-..." autocomplete="off">
        <p class="muted small">キーはこの端末のブラウザ内にだけ保存され、Anthropic以外には送信されません。</p>
        <label for="model" class="label">AIモデル</label>
        <select id="model">
          <option value="claude-opus-5-5">Claude Opus 5.5（高品質・標準）</option>
          <option value="claude-sonnet-5-5">Claude Sonnet 5.5（速い・安い）</option>
          <option value="claude-haiku-5-5">Claude Haiku 5.5（最速・最安）</option>
        </select>
      </div>
      <div class="card">
        <label for="voice" class="label">読み上げの声</label>
        <select id="voice"></select>
        <label for="rate" class="label">標準スピード <span id="rate-val"></span></label>
        <input id="rate" type="range" min="0.5" max="1.3" step="0.05">
        <label for="accent" class="label">英語のアクセント</label>
        <select id="accent">
          <option value="American">アメリカ英語</option>
          <option value="British">イギリス英語</option>
          <option value="Australian">オーストラリア英語</option>
        </select>
        <button id="test-voice" class="btn ghost" type="button">▶ 声をテスト</button>
      </div>
      <div class="card">
        <p class="label">データ（教材のバックアップ）</p>
        <div class="row">
          <button id="export" class="btn ghost" type="button">書き出し</button>
          <label class="btn ghost file">読み込み<input id="import" type="file" accept="application/json" hidden></label>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
